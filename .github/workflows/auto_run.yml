name: 🚀 공고 수집 로봇 (수동 전용, 대전 사무실 PC 실행)

on:
  workflow_dispatch:
    inputs:
      days_ago:
        description: "며칠 이내 공고까지 수집할지 (0=당일만)"
        required: false
        default: "15"
      keywords:
        description: "쉼표로 구분한 키워드"
        required: false
        default: "모집,안전,공고"
      target_orgs:
        description: "특정 발주처만 (콤마 구분) 또는 ALL"
        required: false
        default: "ALL"
      use_proxy:
        description: "무료 프록시 우회 시도 여부"
        required: false
        default: "0"
        type: choice
        options: ["0", "1"]

jobs:
  run-auto-scraper:
    runs-on: self-hosted

    steps:
      - name: 1. 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 2. 필수 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 3. 구글 서비스계정 키 파일 생성
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          Set-Content -Path google_key.json -Value $env:GOOGLE_CREDENTIALS -Encoding utf8 -NoNewline

      - name: 4. 공고 자동 수집 실행
        env:
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
          IGUNSUL_ID: ${{ secrets.IGUNSUL_ID }}
          IGUNSUL_PW: ${{ secrets.IGUNSUL_PW }}
        run: |
          python main.py "${{ inputs.days_ago }}" "${{ inputs.keywords }}" "${{ inputs.target_orgs }}" "${{ inputs.use_proxy }}"

      - name: 5. 임시 키 파일 정리
        if: always()
        run: Remove-Item -Path google_key.json -Force -ErrorAction SilentlyContinue
YAML_EOF
