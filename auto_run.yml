name: 🚀 공고 수집 로봇 (수동 전용, 대전 사무실 PC 실행)

on:
  workflow_dispatch:
    inputs:
      days_ago:
        description: "며칠 이내 공고까지 수집할지 (0=당일만)"
        required: false
        default: "15"
      keywords:
        description: "쉼표로 구분한 키워드"
        required: false
        default: "모집,안전,공고,진단,정밀,점검,성능,수행"
      target_orgs:
        description: "특정 발주처만 (콤마 구분) 또는 ALL"
        required: false
        default: "ALL"
      use_proxy:
        description: "무료 프록시 우회 시도 여부"
        required: false
        default: "0"
        type: choice
        options: ["0", "1"]

jobs:
  run-auto-scraper:
    # 사무실 Windows PC에 등록한 셀프호스팅 러너에서 실행한다.
    # (GitHub이 제공하는 ubuntu-latest 대신 우리 PC가 직접 작업을 받아서 처리 ->
    #  실제 대전 회사 IP로 접속하게 되어 클라우드 IP 차단을 우회할 수 있다)
    runs-on: self-hosted
    env:
      # 이 PC에 이미 설치되어 있는 파이썬을 그대로 쓴다 (actions/setup-python으로
      # 매번 새로 설치하려다가 실패한 적이 있었음 - 이미 있는 걸 굳이 또 설치할
      # 필요가 없다). 다른 경로에 설치했다면 이 값만 바꾸면 된다.
      PYTHON_EXE: C:\Program Files\Python311\python.exe

    steps:
      - name: 1. 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 2. 필수 패키지 설치
        run: |
          & $env:PYTHON_EXE -m pip install --upgrade pip
          & $env:PYTHON_EXE -m pip install -r requirements.txt

      # 예전 워크플로우는 google_key.json을 만드는 단계가 아예 없어서
      # main.py가 구글 시트 연결 단계에서 항상 실패했다. 이 단계가 그 원인을 고친다.
      # Set-Content -Encoding utf8은 Windows PowerShell 5.1에서 파일 맨 앞에
      # 눈에 안 보이는 BOM을 끼워 넣어서, 파이썬이 JSON으로 못 읽는 문제가 있었다.
      # .NET의 UTF8Encoding($false)로 BOM 없이 직접 쓴다.
      - name: 3. 구글 서비스계정 키 파일 생성
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          [System.IO.File]::WriteAllText("$PWD\google_key.json", $env:GOOGLE_CREDENTIALS, (New-Object System.Text.UTF8Encoding $false))

      - name: 4. 공고 자동 수집 실행
        env:
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
          IGUNSUL_ID: ${{ secrets.IGUNSUL_ID }}
          IGUNSUL_PW: ${{ secrets.IGUNSUL_PW }}
          # 한글이 섞인 값(키워드/발주처명)은 실행 스크립트 텍스트에 직접 끼워넣지
          # 않고 환경변수로 전달한다. GitHub이 ${{ inputs.keywords }} 같은 값을
          # 스크립트 파일 텍스트 안에 직접 박아 넣으면, 이 사무실 PC의 PowerShell이
          # 그 스크립트 파일을 읽을 때 한글을 cp949로 잘못 해석해서 글자가 깨지는
          # 문제가 실제로 있었다 ("대상 사이트가 없습니다"로 조용히 끝나버리는
          # 원인이었음). 환경변수는 이 문제와 무관하게 정상적으로 전달된다.
          RUN_DAYS_AGO: ${{ inputs.days_ago }}
          RUN_KEYWORDS: ${{ inputs.keywords }}
          RUN_TARGET_ORGS: ${{ inputs.target_orgs }}
          RUN_USE_PROXY: ${{ inputs.use_proxy }}
          # 파이썬이 콘솔(=실행 로그)에 한글을 출력할 때도 cp949로 잘못 해석해서
          # 깨지거나 UnicodeEncodeError가 나는 문제가 있었다 - 파이썬 자체
          # 입출력을 강제로 UTF-8로 고정해서 방지한다.
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          & $env:PYTHON_EXE main.py $env:RUN_DAYS_AGO $env:RUN_KEYWORDS $env:RUN_TARGET_ORGS $env:RUN_USE_PROXY

      - name: 5. 임시 키 파일 정리
        if: always()
        run: Remove-Item -Path google_key.json -Force -ErrorAction SilentlyContinue

      # 참고: 실제 수집 결과는 전부 구글 시트로 저장되므로(main.py -> storage.py),
      # 이 저장소에는 커밋할 산출물이 없다.
